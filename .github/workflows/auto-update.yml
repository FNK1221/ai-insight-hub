name: Auto Update Content

on:
  schedule:
    # 每天北京时间早上8点（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update regardless of schedule'
        default: 'true'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write  # 允许 dispatch deploy.yml（bot 推送不会自动触发其他 workflow）

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 feedparser

      # 注意：所有抓取步骤都加 continue-on-error，
      # 单个数据源挂掉不影响其他数据的提交（此前 ai_tools 403 导致全线停更近两个月）
      - name: Cache arXiv papers
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cache_arxiv.py

      - name: Cache Hacker News stories
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cache_hn_stories.py

      - name: Cache GitHub trending repos (PAT for higher rate limit)
        continue-on-error: true
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cache_github_repos.py

      - name: Cache AI tools from GitHub
        continue-on-error: true
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cache_ai_tools.py

      - name: Cache RSS industry news
        continue-on-error: true
        run: |
          python scripts/cache_rss.py

      - name: Fetch latest AI news & update content
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/auto_update.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet index.html data/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "AI Insight Bot"
          git config user.email "bot@ai-insight-hub.dev"
          git add index.html data/
          UPDATE_DATE=$(date +"%Y年%m月%d日")
          git commit -m "🤖 自动更新内容 - ${UPDATE_DATE}"
          git push

      - name: Trigger Pages deploy
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
